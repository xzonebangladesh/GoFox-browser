<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tabs</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    body { padding-bottom: 90px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    
    .tab-card { 
      border-radius: 16px; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      box-shadow: 0 3px 8px rgba(0,0,0,0.06); 
      position: relative; 
      height: 220px; 
      transition: transform 0.15s ease;
    }
    .tab-card:active { transform: scale(0.98); }
    .tab-card.cur { border: 2px solid var(--primary); }
    
    .tab-head { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      padding: 9px 10px; 
      background: var(--card-bg); 
      border-bottom: 1px solid var(--border); 
      z-index: 2;
    }
    
    .tab-head .favicon-box { 
      width: 20px; 
      height: 20px; 
      border-radius: 4px; 
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-head .favicon-box img { width: 16px; height: 16px; }
    
    .tab-head b { 
      flex: 1; 
      font-size: 12px; 
      font-weight: 600; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      color: var(--txt); 
    }
    
    .tab-close { 
      background: none; 
      border: 0; 
      padding: 2px; 
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--sub);
      cursor: pointer;
    }

    .tab-preview { 
      flex: 1; 
      width: 100%;
      height: 100%;
      background: var(--bg); 
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tab-preview img.thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .home-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--sub);
      font-size: 13px;
    }

    .fab { 
      position: fixed; 
      right: 20px; 
      bottom: 24px; 
      width: 56px; 
      height: 56px; 
      border-radius: 28px; 
      border: 0; 
      background: var(--primary); 
      color: #fff; 
      box-shadow: 0 4px 14px rgba(26,115,232,0.4); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 20;
      cursor: pointer;
    }
    .fab svg { fill: #ffffff; width: 28px; height: 28px; }
  </style>
</head>
<body>
<div id="h"></div>
<div class="grid" id="g"></div>

<!-- ফ্লোটিং অ্যাড বাটন (SVG) -->
<button class="fab" onclick="call('newTab')">
  <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
</button>

<script>
// কোনো টেক্সট বা ইমোজি নয়, ১০০% পিওর এসভিজি লোগো
function getTabFavicon(url) {
  if (!url || url === 'Home') {
    return `<div class="favicon-box"><svg viewBox="0 0 24 24" width="16" height="16" fill="var(--primary)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>`;
  }
  const h = host(url);
  return `<div class="favicon-box"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64" onerror="this.parentElement.innerHTML='<svg viewBox=\\'0 0 24 24\\' width=\\'16\\' height=\\'16\\' fill=\\'var(--sub)\\'><path d=\\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z\\'/></svg>'"></div>`;
}

function render() {
  const t = get('getTabs');
  // ফিক্স: শুধুমাত্র "Tabs" দেখানো হচ্ছে
  h.innerHTML = `
    <div class="hdr card">
      <button onclick="call('close')">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="var(--sub)"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h2>Tabs</h2>
    </div>
  `;
  
  g.innerHTML = t.map(x => {
    let previewContent = '';
    if (x.thumb) {
      previewContent = `<img class="thumb" src="${x.thumb}" alt="preview">`;
    } else {
      previewContent = `
        <div class="home-preview">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="var(--sub)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <span>${x.url ? esc(host(x.url)) : 'GoFox Home'}</span>
        </div>
      `;
    }

    return `
      <div class="tab-card ${x.cur ? 'cur' : ''}" data-i="${x.i}">
        <div class="tab-head">
          ${getTabFavicon(x.url)}
          <b>${esc(x.title)}</b>
          <button class="tab-close" data-x="${x.i}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--sub)"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="tab-preview">
          ${previewContent}
        </div>
      </div>
    `;
  }).join('');

  g.querySelectorAll('.tab-card').forEach(el => el.onclick = e => {
    const closeBtn = e.target.closest('[data-x]');
    if (closeBtn) {
      e.stopPropagation();
      call('closeTab', +closeBtn.dataset.x);
      setTimeout(render, 120);
    } else {
      call('selectTab', +el.dataset.i);
    }
  });
}
render();
</script>
</body>
</html>
