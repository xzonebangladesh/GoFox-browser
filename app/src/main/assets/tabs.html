<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tabs</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    body { padding-bottom: 90px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    
    /* ক্রোমের মতো কার্ড কনটেইনার */
    .tab-card { 
      border-radius: 16px; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      background: #fff; 
      border: 1px solid #E5E7EB; 
      box-shadow: 0 3px 8px rgba(0,0,0,0.07); 
      position: relative; 
      height: 220px; 
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    
    .tab-card:active {
      transform: scale(0.98);
    }
    
    .tab-card.cur { 
      border: 2px solid var(--primary); 
    }
    
    /* ট্যাব হেডার: Favicon + Title + Close Button */
    .tab-head { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      padding: 8px 10px; 
      background: #FFFFFF; 
      border-bottom: 1px solid #F3F4F6; 
      z-index: 2;
    }
    
    .tab-head .favicon-box { 
      width: 20px; 
      height: 20px; 
      border-radius: 4px; 
      background: none;
    }
    
    .tab-head .favicon-box img { 
      width: 16px; 
      height: 16px; 
    }
    
    .tab-head b { 
      flex: 1; 
      font-size: 12px; 
      font-weight: 600; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      color: #1F2937; 
    }
    
    .tab-close { 
      background: none; 
      border: 0; 
      font-size: 18px; 
      color: #6B7280; 
      padding: 0 4px; 
      line-height: 1; 
      border-radius: 50%;
    }

    /* আসল ওয়েবসাইটের লাইভ থাম্বনেইল ভিউ */
    .tab-preview { 
      flex: 1; 
      width: 100%;
      height: 100%;
      background: #F9FAFB; 
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tab-preview img.thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .home-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #9CA3AF;
      font-size: 13px;
    }

    .fab { 
      position: fixed; 
      right: 20px; 
      bottom: 24px; 
      width: 56px; 
      height: 56px; 
      border-radius: 28px; 
      border: 0; 
      background: var(--primary); 
      color: #fff; 
      font-size: 28px; 
      box-shadow: 0 4px 14px rgba(26,115,232,0.4); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 20;
    }
  </style>
</head>
<body>
<div id="h"></div>
<div class="grid" id="g"></div>
<button class="fab" onclick="call('newTab')">+</button>

<script>
function render() {
    const t = get('getTabs');
    h.innerHTML = header('Tabs (' + t.length + ')');
    
    g.innerHTML = t.map(x => {
        let previewContent = '';
        if (x.thumb) {
            // যদি পেজের আসল স্ক্রিনশট থাকে তবে সেটাই ক্রোমের মতো লাইভ প্রিভিউ হবে
            previewContent = `<img class="thumb" src="${x.thumb}" alt="page view">`;
        } else {
            // হোম পেজ বা প্রথমবার লোড হওয়ার সময় ক্লিন ভিউ
            previewContent = `
                <div class="home-preview">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="#9CA3AF"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <span>${x.url ? esc(host(x.url)) : 'GoFox Home'}</span>
                </div>
            `;
        }

        return `
            <div class="tab-card ${x.cur ? 'cur' : ''}" data-i="${x.i}">
                <div class="tab-head">
                    ${favicon(x.url)}
                    <b>${esc(x.title)}</b>
                    <button class="tab-close" data-x="${x.i}">&times;</button>
                </div>
                <div class="tab-preview">
                    ${previewContent}
                </div>
            </div>
        `;
    }).join('');

    g.querySelectorAll('.tab-card').forEach(el => el.onclick = e => {
        if (e.target.dataset.x !== undefined) {
            e.stopPropagation();
            call('closeTab', +e.target.dataset.x);
            setTimeout(render, 120);
        } else {
            call('selectTab', +el.dataset.i);
        }
    });
}
render();
</script>
</body>
</html>
