<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmarks</title>
<link rel="stylesheet" href="common.css"><script src="common.js"></script></head><body>
<div id="h"></div><div id="l"></div>
<script>
function render(){h.innerHTML=header('Bookmarks');const b=get('getBookmarks');
if(!b.length){l.innerHTML='<div class="empty">No bookmarks yet.<br>Use Menu &rsaquo; Add bookmark.</div>';return}
l.innerHTML='<div class="list glass">'+b.map((x,i)=>`<div class="row" data-i="${i}">${letter(x.t,x.u)}<div class="m"><div>${esc(x.t)}</div><div class="sub">${esc(host(x.u))}</div></div><button class="ib" data-d="${i}">&#128465;</button></div>`).join('')+'</div>';
l.querySelectorAll('.row').forEach(el=>el.onclick=e=>{const x=b[el.dataset.i];if(e.target.dataset.d!==undefined){call('removeBookmark',x.u);render()}else call('openUrl',x.u)})}
render();
</script></body></html>
