<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tabs</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-bottom: 70px; }
    .tab-card { border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; background: #fff; border: 1px solid #E5E7EB; box-shadow: 0 2px 5px rgba(0,0,0,0.06); position: relative; height: 180px; }
    .tab-card.cur { border: 2px solid var(--primary); }
    .tab-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #F9FAFB; border-bottom: 1px solid #E5E7EB; }
    .tab-head .favicon-box { width: 22px; height: 22px; border-radius: 6px; }
    .tab-head .favicon-box img { width: 14px; height: 14px; }
    .tab-head b { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1F2937; }
    .tab-close { background: none; border: 0; font-size: 18px; color: #9CA3AF; padding: 2px 4px; line-height: 1; }
    .tab-preview { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; background: #FAFBFD; text-align: center; }
    .tab-preview .domain { font-size: 12px; color: #6B7280; font-weight: 500; word-break: break-all; }
    .fab { position: fixed; right: 20px; bottom: 24px; width: 56px; height: 56px; border-radius: 28px; border: 0; background: var(--primary); color: #fff; font-size: 28px; box-shadow: 0 4px 12px rgba(26,115,232,0.35); display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div id="h"></div>
<div class="grid" id="g"></div>
<button class="fab" onclick="call('newTab')">+</button>

<script>
function render() {
    const t = get('getTabs');
    h.innerHTML = header('Tabs (' + t.length + ')');
    g.innerHTML = t.map(x => `
        <div class="tab-card ${x.cur ? 'cur' : ''}" data-i="${x.i}">
            <div class="tab-head">
                ${favicon(x.url)}
                <b>${esc(x.title)}</b>
                <button class="tab-close" data-x="${x.i}">&times;</button>
            </div>
            <div class="tab-preview">
                <span class="domain">${x.url ? esc(host(x.url)) : 'GoFox Home'}</span>
            </div>
        </div>
    `).join('');

    g.querySelectorAll('.tab-card').forEach(el => el.onclick = e => {
        if (e.target.dataset.x !== undefined) {
            e.stopPropagation();
            call('closeTab', +e.target.dataset.x);
            setTimeout(render, 120);
        } else {
            call('selectTab', +el.dataset.i);
        }
    });
}
render();
</script>
</body>
</html>
