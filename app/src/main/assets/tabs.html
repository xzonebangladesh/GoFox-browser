<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabs</title>
<link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.t{border-radius:22px;padding:14px;min-height:120px;position:relative}
.t.cur{border:2px solid #FF6A1A}.t b{display:block;font-size:14px;margin:10px 22px 4px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:22px;color:#555}
.fab{position:fixed;right:22px;bottom:30px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#ff8a3d,#ff4f8b);color:#fff;font-size:32px;box-shadow:0 8px 20px rgba(255,90,100,.45)}</style></head><body>
<div id="h"></div><div class="grid" id="g"></div><button class="fab" onclick="call('newTab')">+</button>
<script>
function render(){const t=get('getTabs');h.innerHTML=header('Tabs ('+t.length+')');
g.innerHTML=t.map(x=>`<div class="t glass ${x.cur?'cur':''}" data-i="${x.i}">${letter(x.title,x.url)}<b>${esc(x.title)}</b><div class="sub">${esc(x.url)}</div><button class="x" data-x="${x.i}">&times;</button></div>`).join('');
g.querySelectorAll('.t').forEach(el=>el.onclick=e=>{if(e.target.dataset.x!==undefined){call('closeTab',+e.target.dataset.x);setTimeout(render,150)}else call('selectTab',+el.dataset.i)})}
render();
</script></body></html>
