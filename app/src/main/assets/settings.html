<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    .g-title { font-size: 12px; font-weight: 700; color: #6B7280; padding: 12px 6px 6px; text-transform: uppercase; }
    .v { color: var(--sub); font-size: 14px; }
    .opt { display: flex; align-items: center; justify-content: space-between; padding: 14px; font-size: 15px; border-radius: 12px; margin-bottom: 4px; }
    .opt.on { background: #E8F0FE; color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
<div id="h"></div>
<div id="l"></div>

<script>
const E = { google: 'Google', bing: 'Bing', duckduckgo: 'DuckDuckGo', brave: 'Brave', yahoo: 'Yahoo' };
let S = { engine: 'google', home: '' };

function load() { try { S = JSON.parse(call('getSettings')); } catch (e) {} }

function render() {
    load();
    h.innerHTML = header('Settings');
    l.innerHTML = `
        <div class="g-title">General</div>
        <div class="list card">
            <div class="row" id="se"><div class="m"><div>Search engine</div><div class="sub">${E[S.engine] || 'Google'}</div></div><span class="v">›</span></div>
            <div class="row" id="hp"><div class="m"><div>Homepage</div><div class="sub">${S.home ? esc(host(S.home)) : 'GoFox Home'}</div></div><span class="v">›</span></div>
        </div>
        <div class="g-title">Privacy</div>
        <div class="list card">
            <div class="row" id="cl"><div class="m"><div>Clear browsing data</div><div class="sub">History, cookies and cache</div></div><span class="v">›</span></div>
        </div>
        <div class="g-title">About</div>
        <div class="list card">
            <div class="row" id="ab"><div class="m"><div>About GoFox</div><div class="sub">Version 1.0</div></div><span class="v">›</span></div>
        </div>`;

    se.onclick = () => {
        const d = dlg('<h3>Search engine</h3>' + Object.keys(E).map(k => `<div class="opt ${k === S.engine ? 'on' : ''}" data-k="${k}">${E[k]}<span>${k === S.engine ? '✓' : ''}</span></div>`).join(''));
        d.querySelectorAll('.opt').forEach(o => o.onclick = () => {
            call('setEngine', o.dataset.k);
            d.remove();
            render();
            call('notify', 'Search engine: ' + E[o.dataset.k]);
        });
    };

    hp.onclick = () => {
        const d = dlg(`<h3>Homepage</h3><p>Enter link to open as home page. Leave empty for GoFox Home.</p><input id="u" placeholder="https://" value="${esc(S.home)}" inputmode="url" autocapitalize="off"><div class="btns"><button class="b0">Reset</button><button class="b1">Save</button></div>`);
        d.querySelector('.b0').onclick = () => { call('setHomeUrl', ''); d.remove(); setTimeout(render, 150); };
        d.querySelector('.b1').onclick = () => { call('setHomeUrl', d.querySelector('#u').value); d.remove(); setTimeout(render, 150); };
    };

    cl.onclick = () => confirmDlg('Clear browsing data', 'This will delete history, cookies and cached files.', 'Clear', () => call('clearData'));
    ab.onclick = () => call('openAbout');
}
render();
</script>
</body>
</html>
